name: CI - customer-process-api

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate, test, and package PAPI
    runs-on: ubuntu-latest

    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      MAVEN_VERSION: "3.9.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Maven 3.9.9
        shell: bash
        run: |
          MAVEN_ARCHIVE="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          MAVEN_URL="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/${MAVEN_ARCHIVE}"

          echo "Downloading Maven ${MAVEN_VERSION}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "$MAVEN_URL" \
            --output "$RUNNER_TEMP/$MAVEN_ARCHIVE"

          mkdir -p "$RUNNER_TEMP/maven"

          tar \
            -xzf "$RUNNER_TEMP/$MAVEN_ARCHIVE" \
            -C "$RUNNER_TEMP/maven"

          MAVEN_HOME="$RUNNER_TEMP/maven/apache-maven-${MAVEN_VERSION}"

          if [ ! -x "$MAVEN_HOME/bin/mvn" ]; then
            echo "::error::Maven ${MAVEN_VERSION} installation failed"
            exit 1
          fi

          echo "MAVEN_HOME=$MAVEN_HOME" >> "$GITHUB_ENV"
          echo "$MAVEN_HOME/bin" >> "$GITHUB_PATH"

          rm -f "$RUNNER_TEMP/$MAVEN_ARCHIVE"

      - name: Verify Java and Maven versions
        shell: bash
        run: |
          java -version
          mvn --version

          ACTUAL_MAVEN_VERSION=$(mvn --version | head -1)

          if [[ "$ACTUAL_MAVEN_VERSION" != *"Apache Maven 3.9.9"* ]]; then
            echo "::error::Expected Maven 3.9.9 but found: $ACTUAL_MAVEN_VERSION"
            exit 1
          fi

          echo "Maven 3.9.9 is active."

      - name: Check required Anypoint secrets
        shell: bash
        run: |
          if [ -z "$ANYPOINT_CLIENT_ID" ]; then
            echo "::error::ANYPOINT_CLIENT_ID repository secret is missing"
            exit 1
          fi

          if [ -z "$ANYPOINT_CLIENT_SECRET" ]; then
            echo "::error::ANYPOINT_CLIENT_SECRET repository secret is missing"
            exit 1
          fi

          echo "Required Anypoint repository secrets are available."

      - name: Verify Anypoint Connected App authentication
        shell: bash
        run: |
          TOKEN_RESPONSE="$RUNNER_TEMP/anypoint-token-response.json"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output "$TOKEN_RESPONSE" \
            --write-out "%{http_code}" \
            --request POST \
            "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=$ANYPOINT_CLIENT_ID" \
            --data-urlencode "client_secret=$ANYPOINT_CLIENT_SECRET" \
            --data-urlencode "grant_type=client_credentials")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GitHub Secrets could not authenticate the Anypoint Connected App. HTTP status: $HTTP_STATUS"
            rm -f "$TOKEN_RESPONSE"
            exit 1
          fi

          python3 <<'PY'
          import json
          import os

          response_path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "anypoint-token-response.json"
          )

          with open(response_path, encoding="utf-8") as response_file:
              response = json.load(response_file)

          if response.get("token_type", "").lower() != "bearer":
              raise RuntimeError(
                  "Anypoint response did not contain a bearer token"
              )

          if not response.get("access_token"):
              raise RuntimeError(
                  "Anypoint response did not contain an access token"
              )

          print(
              "GitHub repository secrets successfully authenticated "
              "the Anypoint Connected App."
          )
          PY

          rm -f "$TOKEN_RESPONSE"

      - name: Create Maven settings.xml
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"

          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          settings_namespace = (
              "http://maven.apache.org/SETTINGS/1.0.0"
          )

          xsi_namespace = (
              "http://www.w3.org/2001/XMLSchema-instance"
          )

          ET.register_namespace("", settings_namespace)
          ET.register_namespace("xsi", xsi_namespace)

          client_id = os.environ["ANYPOINT_CLIENT_ID"]
          client_secret = os.environ["ANYPOINT_CLIENT_SECRET"]

          root = ET.Element(
              f"{{{settings_namespace}}}settings",
              {
                  f"{{{xsi_namespace}}}schemaLocation":
                      "http://maven.apache.org/SETTINGS/1.0.0 "
                      "https://maven.apache.org/xsd/settings-1.0.0.xsd"
              }
          )

          servers = ET.SubElement(
              root,
              f"{{{settings_namespace}}}servers"
          )

          server = ET.SubElement(
              servers,
              f"{{{settings_namespace}}}server"
          )

          server_id = ET.SubElement(
              server,
              f"{{{settings_namespace}}}id"
          )
          server_id.text = "anypoint-exchange-v3"

          username = ET.SubElement(
              server,
              f"{{{settings_namespace}}}username"
          )
          username.text = "~~~Client~~~"

          password = ET.SubElement(
              server,
              f"{{{settings_namespace}}}password"
          )
          password.text = (
              client_id + "~?~" + client_secret
          )

          settings_path = os.path.expanduser(
              "~/.m2/settings.xml"
          )

          tree = ET.ElementTree(root)

          tree.write(
              settings_path,
              encoding="UTF-8",
              xml_declaration=True
          )

          ET.parse(settings_path)

          print(
              "Maven settings.xml created successfully "
              "for server anypoint-exchange-v3."
          )
          PY

      - name: Validate Maven settings.xml safely
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          settings_path = os.path.expanduser(
              "~/.m2/settings.xml"
          )

          tree = ET.parse(settings_path)
          root = tree.getroot()

          namespace = {
              "m": "http://maven.apache.org/SETTINGS/1.0.0"
          }

          server_id = root.findtext(
              "m:servers/m:server/m:id",
              namespaces=namespace
          )

          username = root.findtext(
              "m:servers/m:server/m:username",
              namespaces=namespace
          )

          password = root.findtext(
              "m:servers/m:server/m:password",
              namespaces=namespace
          )

          if server_id != "anypoint-exchange-v3":
              raise RuntimeError(
                  "Maven server ID is missing or incorrect"
              )

          if username != "~~~Client~~~":
              raise RuntimeError(
                  "Connected App Maven username is incorrect"
              )

          if not password or "~?~" not in password:
              raise RuntimeError(
                  "Connected App Maven password format is incorrect"
              )

          print("Maven settings.xml is valid.")
          print("Maven server ID: anypoint-exchange-v3")
          print(
              "Connected App Maven authentication "
              "format is configured."
          )
          PY

      - name: Clear incompatible cached Maven libraries
        shell: bash
        run: |
          echo "Clearing cached Mule Maven Plugin and Maven Resolver libraries."

          rm -rf \
            "$HOME/.m2/repository/org/mule/tools/maven/mule-maven-plugin"

          rm -rf \
            "$HOME/.m2/repository/org/mule/tools/maven/mule-packager"

          rm -rf \
            "$HOME/.m2/repository/org/mule/tools/maven/mule-deployer"

          rm -rf \
            "$HOME/.m2/repository/org/mule/mule-maven-client-api"

          rm -rf \
            "$HOME/.m2/repository/org/mule/mule-maven-client-impl"

          rm -rf \
            "$HOME/.m2/repository/org/apache/maven/resolver"

          echo "Conflicting cached Maven libraries were removed."

      - name: Maven validate
        shell: bash
        run: |
          mvn \
            -B \
            -ntp \
            -U \
            -s "$HOME/.m2/settings.xml" \
            validate

      - name: Run MUnit tests and coverage
        shell: bash
        run: |
          mvn \
            -B \
            -ntp \
            -s "$HOME/.m2/settings.xml" \
            clean test

      - name: Discover generated MUnit reports
        if: always()
        shell: bash
        run: |
          echo "============================================"
          echo "Generated MUnit and test report files"
          echo "============================================"

          if [ -d "target" ]; then
            find target \
              -maxdepth 6 \
              -type f \
              \( \
                -name "*.xml" \
                -o -name "*.html" \
                -o -name "*.txt" \
              \) \
              -print 2>/dev/null || true
          else
            echo "target directory was not generated."
          fi

          if [ -d "reports" ]; then
            find reports \
              -maxdepth 6 \
              -type f \
              \( \
                -name "*.xml" \
                -o -name "*.html" \
                -o -name "*.txt" \
              \) \
              -print 2>/dev/null || true
          else
            echo "reports directory was not generated."
          fi

          echo "============================================"

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-process-api-munit-reports
          path: |
            target/surefire-reports/**
            target/munit-reports/**
            target/site/munit/**
            target/coverage-reports/**
            target/test-results/**
            reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Package Mule application
        shell: bash
        run: |
          mvn \
            -B \
            -ntp \
            -s "$HOME/.m2/settings.xml" \
            package \
            -DskipMunitTests=true

      - name: Locate deployable Mule application JAR
        id: locate_jar
        shell: bash
        run: |
          mapfile -t ARTIFACTS < <(
            find target \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              ! -name "original-*" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar"
          )

          ARTIFACT_COUNT="${#ARTIFACTS[@]}"

          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No deployable Mule application JAR was found."

            echo "Files currently present in target:"

            find target \
              -maxdepth 1 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          if [ "$ARTIFACT_COUNT" -gt 1 ]; then
            echo "::error::Multiple candidate Mule JARs were found."

            printf '%s\n' "${ARTIFACTS[@]}"

            exit 1
          fi

          ARTIFACT_PATH="${ARTIFACTS[0]}"

          if [ ! -s "$ARTIFACT_PATH" ]; then
            echo "::error::Deployable Mule JAR is empty: $ARTIFACT_PATH"
            exit 1
          fi

          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

          echo "Deployable Mule application JAR:"
          ls -lh "$ARTIFACT_PATH"

      - name: Upload packaged Mule application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: customer-process-api-package
          path: ${{ steps.locate_jar.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Customer Process API CI"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Java: \`17\`"
            echo "- Maven: \`3.9.9\`"
            echo "- Maven server: \`anypoint-exchange-v3\`"
            echo "- Deployment: \`Not configured\`"
          } >> "$GITHUB_STEP_SUMMARY"
