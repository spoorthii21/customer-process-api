name: Customer Process API CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy PAPI to CloudHub 2.0
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test, Publish and Deploy PAPI
    runs-on: ubuntu-latest

    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      MAVEN_VERSION: "3.9.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.9"

      - name: Display Java and Maven versions
        shell: bash
        run: |
          java -version
          mvn --version

          ACTUAL_MAVEN_VERSION="$(mvn --version | head -1)"

          if [[ "$ACTUAL_MAVEN_VERSION" != *"Apache Maven 3.9.9"* ]]; then
            echo "::error::Expected Maven 3.9.9 but found: $ACTUAL_MAVEN_VERSION"
            exit 1
          fi

          echo "Java 17 and Maven 3.9.9 are active."

      - name: Validate required Anypoint build secrets
        shell: bash
        run: |
          MISSING=0

          if [ -z "$ANYPOINT_CLIENT_ID" ]; then
            echo "::error::ANYPOINT_CLIENT_ID repository secret is missing"
            MISSING=1
          fi

          if [ -z "$ANYPOINT_CLIENT_SECRET" ]; then
            echo "::error::ANYPOINT_CLIENT_SECRET repository secret is missing"
            MISSING=1
          fi

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "Required Anypoint build secrets are available."

      - name: Verify Anypoint Connected App authentication
        shell: bash
        run: |
          TOKEN_RESPONSE="$RUNNER_TEMP/anypoint-token-response.json"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output "$TOKEN_RESPONSE" \
            --write-out "%{http_code}" \
            --request POST \
            "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" \
            --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}" \
            --data-urlencode "grant_type=client_credentials")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Connected App authentication failed. HTTP status: $HTTP_STATUS"

            if [ -f "$TOKEN_RESPONSE" ]; then
              python3 -c \
                'import json,sys; data=json.load(open(sys.argv[1])); print("Anypoint error:", data.get("error_description", data.get("error", "Unknown authentication error")))' \
                "$TOKEN_RESPONSE" || true
            fi

            rm -f "$TOKEN_RESPONSE"
            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          import sys

          response_path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "anypoint-token-response.json"
          )

          with open(response_path, encoding="utf-8") as response_file:
              response = json.load(response_file)

          if response.get("token_type", "").lower() != "bearer":
              print(
                  "::error::Anypoint response did not contain a bearer token"
              )
              sys.exit(1)

          if not response.get("access_token"):
              print(
                  "::error::Anypoint response did not contain an access token"
              )
              sys.exit(1)

          print(
              "GitHub repository secrets successfully authenticated "
              "the Anypoint Connected App."
          )
          PY

          rm -f "$TOKEN_RESPONSE"

      - name: Configure Maven settings for Anypoint Exchange
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"

          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          settings_namespace = (
              "http://maven.apache.org/SETTINGS/1.0.0"
          )

          xsi_namespace = (
              "http://www.w3.org/2001/XMLSchema-instance"
          )

          ET.register_namespace("", settings_namespace)
          ET.register_namespace("xsi", xsi_namespace)

          client_id = os.environ["ANYPOINT_CLIENT_ID"]
          client_secret = os.environ["ANYPOINT_CLIENT_SECRET"]

          root = ET.Element(
              f"{{{settings_namespace}}}settings",
              {
                  f"{{{xsi_namespace}}}schemaLocation":
                      "http://maven.apache.org/SETTINGS/1.0.0 "
                      "https://maven.apache.org/xsd/settings-1.0.0.xsd"
              }
          )

          servers = ET.SubElement(
              root,
              f"{{{settings_namespace}}}servers"
          )

          server = ET.SubElement(
              servers,
              f"{{{settings_namespace}}}server"
          )

          server_id = ET.SubElement(
              server,
              f"{{{settings_namespace}}}id"
          )
          server_id.text = "anypoint-exchange-v3"

          username = ET.SubElement(
              server,
              f"{{{settings_namespace}}}username"
          )
          username.text = "~~~Client~~~"

          password = ET.SubElement(
              server,
              f"{{{settings_namespace}}}password"
          )
          password.text = f"{client_id}~?~{client_secret}"

          settings_path = os.path.expanduser(
              "~/.m2/settings.xml"
          )

          tree = ET.ElementTree(root)

          tree.write(
              settings_path,
              encoding="UTF-8",
              xml_declaration=True
          )

          ET.parse(settings_path)

          print(
              "Maven settings.xml created successfully "
              "for anypoint-exchange-v3."
          )
          PY

      - name: Validate Maven settings safely
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          settings_path = os.path.expanduser(
              "~/.m2/settings.xml"
          )

          root = ET.parse(settings_path).getroot()

          namespace = {
              "m": "http://maven.apache.org/SETTINGS/1.0.0"
          }

          server_id = root.findtext(
              "m:servers/m:server/m:id",
              namespaces=namespace
          )

          username = root.findtext(
              "m:servers/m:server/m:username",
              namespaces=namespace
          )

          password = root.findtext(
              "m:servers/m:server/m:password",
              namespaces=namespace
          )

          if server_id != "anypoint-exchange-v3":
              print(
                  "::error::Maven server ID is missing or incorrect"
              )
              sys.exit(1)

          if username != "~~~Client~~~":
              print(
                  "::error::Connected App Maven username is incorrect"
              )
              sys.exit(1)

          if not password or "~?~" not in password:
              print(
                  "::error::Connected App Maven password format is incorrect"
              )
              sys.exit(1)

          print("Maven settings.xml is valid.")
          PY

      - name: Validate required PAPI project files
        shell: bash
        run: |
          test -f pom.xml || {
            echo "::error::pom.xml was not found."
            exit 1
          }

          test -f mule-artifact.json || {
            echo "::error::mule-artifact.json was not found."
            exit 1
          }

          test -d src/main/mule || {
            echo "::error::src/main/mule was not found."
            exit 1
          }

          test -d src/test/munit || {
            echo "::error::src/test/munit was not found."
            exit 1
          }

          MULE_XML_COUNT=$(find src/main/mule \
            -maxdepth 1 \
            -type f \
            -name "*.xml" \
            | wc -l)

          MUNIT_XML_COUNT=$(find src/test/munit \
            -maxdepth 1 \
            -type f \
            -name "*.xml" \
            | wc -l)

          if [ "$MULE_XML_COUNT" -eq 0 ]; then
            echo "::error::No Mule XML files were found in src/main/mule."
            exit 1
          fi

          if [ "$MUNIT_XML_COUNT" -eq 0 ]; then
            echo "::error::No MUnit XML files were found in src/test/munit."
            exit 1
          fi

          echo "Required PAPI project files are available."
          echo "Mule XML files: $MULE_XML_COUNT"
          echo "MUnit XML files: $MUNIT_XML_COUNT"

      - name: Validate PAPI Autodiscovery configuration
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          mule_directory = Path("src/main/mule")

          autodiscovery = None
          autodiscovery_file = None

          for file_path in sorted(mule_directory.glob("*.xml")):
              try:
                  root = ET.parse(file_path).getroot()
              except ET.ParseError as exc:
                  print(
                      f"::error::{file_path} is not valid XML: {exc}"
                  )
                  sys.exit(1)

              for element in root.iter():
                  local_name = element.tag.split("}")[-1].lower()

                  if local_name in ("autodiscovery", "discovery"):
                      autodiscovery = element
                      autodiscovery_file = file_path
                      break

              if autodiscovery is not None:
                  break

          if autodiscovery is None:
              print(
                  "::error::API Autodiscovery element was not found "
                  "in src/main/mule XML files"
              )
              sys.exit(1)

          api_id = (
              autodiscovery.get("apiId") or ""
          ).strip()

          flow_ref = (
              autodiscovery.get("flowRef") or ""
          ).strip()

          if not api_id:
              print(
                  "::error::Autodiscovery apiId is empty"
              )
              sys.exit(1)

          if not re.fullmatch(r"[0-9]+", api_id):
              print(
                  "::error::Autodiscovery apiId must contain only "
                  "the numeric API Instance ID"
              )
              sys.exit(1)

          if flow_ref != "customer-process-apiraml-main":
              print(
                  "::error::Autodiscovery flowRef must be "
                  "customer-process-apiraml-main"
              )
              sys.exit(1)

          print(
              "Customer Process API Autodiscovery "
              "configuration is valid."
          )

          print(
              f"Autodiscovery file: {autodiscovery_file}"
          )

          print(
              f"Autodiscovery API ID: {api_id}"
          )

          print(
              f"Autodiscovery flowRef: {flow_ref}"
          )
          PY

      - name: Clear incompatible cached Maven libraries
        shell: bash
        run: |
          echo "Clearing cached Mule Maven Plugin libraries."

          rm -rf \
            "$HOME/.m2/repository/org/mule/tools/maven/mule-maven-plugin"

          rm -rf \
            "$HOME/.m2/repository/org/mule/tools/maven/mule-packager"

          rm -rf \
            "$HOME/.m2/repository/org/mule/tools/maven/mule-deployer"

          rm -rf \
            "$HOME/.m2/repository/org/mule/mule-maven-client-api"

          rm -rf \
            "$HOME/.m2/repository/org/mule/mule-maven-client-impl"

          rm -rf \
            "$HOME/.m2/repository/org/apache/maven/resolver"

          echo "Conflicting cached Maven libraries were removed."

      - name: Maven validate
        shell: bash
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            --update-snapshots \
            --settings "$HOME/.m2/settings.xml" \
            validate

      - name: Run MUnit tests and coverage
        id: munit
        shell: bash
        run: |
          set +e

          MUNIT_LOG="$RUNNER_TEMP/munit-console.log"

          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            clean test \
            2>&1 | tee "$MUNIT_LOG"

          MAVEN_EXIT_CODE=${PIPESTATUS[0]}

          echo "maven_exit_code=$MAVEN_EXIT_CODE" \
            >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "MUnit execution summary"
          echo "============================================"

          grep \
            -nE \
            "FAILURE|ERROR|Tests run:|Failed:|Errors:|Skipped:|Caused by:|AssertionError|Expected:|but:|Failed to deploy|There was.*error|BUILD FAILURE" \
            "$MUNIT_LOG" \
            | tail -250 || true

          echo "============================================"
          echo "MUnit Maven exit code: $MAVEN_EXIT_CODE"
          echo "============================================"

          exit "$MAVEN_EXIT_CODE"

      - name: Collect MUnit diagnostic files
        if: always()
        shell: bash
        run: |
          DIAGNOSTIC_DIR="$RUNNER_TEMP/munit-diagnostics"

          mkdir -p "$DIAGNOSTIC_DIR"

          if [ -f "$RUNNER_TEMP/munit-console.log" ]; then
            cp \
              "$RUNNER_TEMP/munit-console.log" \
              "$DIAGNOSTIC_DIR/munit-console.log"
          fi

          if [ -d "target" ]; then
            find target \
              -maxdepth 8 \
              -type f \
              \( \
                -name "*.xml" \
                -o -name "*.html" \
                -o -name "*.txt" \
                -o -name "*.log" \
              \) \
              -print \
              -exec cp \
                --parents \
                "{}" \
                "$DIAGNOSTIC_DIR/" \
              \; 2>/dev/null || true
          fi

          if [ -d "reports" ]; then
            find reports \
              -maxdepth 8 \
              -type f \
              \( \
                -name "*.xml" \
                -o -name "*.html" \
                -o -name "*.txt" \
                -o -name "*.log" \
              \) \
              -print \
              -exec cp \
                --parents \
                "{}" \
                "$DIAGNOSTIC_DIR/" \
              \; 2>/dev/null || true
          fi

          echo "Collected MUnit diagnostic files:"

          find \
            "$DIAGNOSTIC_DIR" \
            -type f \
            -print 2>/dev/null || true

      - name: Upload MUnit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-process-api-munit-diagnostics
          path: ${{ runner.temp }}/munit-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-process-api-munit-reports
          path: |
            target/surefire-reports/**
            target/munit-reports/**
            target/site/munit/**
            target/coverage-reports/**
            target/test-results/**
            target/**/*.log
            reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Package Mule application
        if: success()
        shell: bash
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            package \
            -DskipMunitTests=true

      - name: Locate deployable Mule application JAR
        if: success()
        id: locate_jar
        shell: bash
        run: |
          mapfile -t ARTIFACTS < <(
            find target \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              ! -name "original-*" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar"
          )

          ARTIFACT_COUNT="${#ARTIFACTS[@]}"

          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No deployable Mule application JAR was found."

            find target \
              -maxdepth 1 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          if [ "$ARTIFACT_COUNT" -gt 1 ]; then
            echo "::error::Multiple candidate Mule JARs were found."

            printf '%s\n' "${ARTIFACTS[@]}"

            exit 1
          fi

          ARTIFACT_PATH="${ARTIFACTS[0]}"

          if [ ! -s "$ARTIFACT_PATH" ]; then
            echo "::error::Deployable Mule JAR is empty: $ARTIFACT_PATH"
            exit 1
          fi

          echo "artifact_path=$ARTIFACT_PATH" \
            >> "$GITHUB_OUTPUT"

          echo "Deployable Mule application JAR:"

          ls -lh "$ARTIFACT_PATH"

      - name: Upload packaged Mule application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: customer-process-api-package
          path: ${{ steps.locate_jar.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Validate CloudHub 2.0 deployment variables
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          PAPI_APPLICATION_NAME: ${{ vars.PAPI_APPLICATION_NAME }}
        run: |
          REQUIRED_VARIABLES=(
            ANYPOINT_ORG_ID
            ANYPOINT_ENVIRONMENT
            CLOUDHUB_TARGET
            PAPI_APPLICATION_NAME
          )

          MISSING=0

          for VARIABLE_NAME in "${REQUIRED_VARIABLES[@]}"; do
            if [ -z "${!VARIABLE_NAME}" ]; then
              echo "::error::$VARIABLE_NAME repository variable is missing"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "CloudHub 2.0 deployment variables are available."
          echo "Environment: $ANYPOINT_ENVIRONMENT"
          echo "Target: $CLOUDHUB_TARGET"
          echo "Application: $PAPI_APPLICATION_NAME"

      - name: Validate deployment and runtime secrets
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}
          MULE_KEY: ${{ secrets.MULE_KEY }}
        run: |
          REQUIRED_SECRETS=(
            CONNECTED_APP_CLIENT_ID
            CONNECTED_APP_CLIENT_SECRET
            ANYPOINT_PLATFORM_CLIENT_ID
            ANYPOINT_PLATFORM_CLIENT_SECRET
            MULE_KEY
          )

          MISSING=0

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "::error::$SECRET_NAME repository secret is missing"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "Deployment credentials and runtime secrets are available."

      - name: Publish PAPI application to Anypoint Exchange
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          PAPI_APPLICATION_NAME: ${{ vars.PAPI_APPLICATION_NAME }}
          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}
          MULE_KEY: ${{ secrets.MULE_KEY }}
        run: |
          echo "Publishing Customer Process API to Anypoint Exchange..."

          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            deploy \
            -DskipMuleDeploy \
            -DskipTests

      - name: Deploy PAPI application to CloudHub 2.0
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            inputs.deploy == true
          }}
        shell: bash
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          PAPI_APPLICATION_NAME: ${{ vars.PAPI_APPLICATION_NAME }}
          ANYPOINT_PLATFORM_CLIENT_ID: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}
          MULE_KEY: ${{ secrets.MULE_KEY }}
        run: |
          echo "Deploying Customer Process API to CloudHub 2.0..."
          echo "Application: $PAPI_APPLICATION_NAME"
          echo "Environment: $ANYPOINT_ENVIRONMENT"
          echo "Target: $CLOUDHUB_TARGET"

          mvn \
            --batch-mode \
            --no-transfer-progress \
            --settings "$HOME/.m2/settings.xml" \
            mule:deploy \
            -DskipTests

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          DEPLOY_REQUESTED: ${{ inputs.deploy || false }}
          PAPI_APPLICATION_NAME: ${{ vars.PAPI_APPLICATION_NAME }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
        run: |
          {
            echo "## Customer Process API CI/CD"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Java: \`17\`"
            echo "- Maven: \`3.9.9\`"
            echo "- Maven server: \`anypoint-exchange-v3\`"
            echo "- MUnit Maven exit code: \`${{ steps.munit.outputs.maven_exit_code }}\`"
            echo "- Application: \`${PAPI_APPLICATION_NAME:-not configured}\`"
            echo "- Environment: \`${ANYPOINT_ENVIRONMENT:-not configured}\`"
            echo "- Target: \`${CLOUDHUB_TARGET:-not configured}\`"
            echo "- API Autodiscovery flow: \`customer-process-apiraml-main\`"
            echo "- Deployment requested: \`$DEPLOY_REQUESTED\`"

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && \
               [ "$GITHUB_REF" = "refs/heads/main" ] && \
               [ "$DEPLOY_REQUESTED" = "true" ]; then
              echo "- Exchange publishing: \`Enabled\`"
              echo "- CloudHub 2.0 deployment: \`Enabled\`"
            else
              echo "- Exchange publishing: \`Not executed\`"
              echo "- CloudHub 2.0 deployment: \`Not executed\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"