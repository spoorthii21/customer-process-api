name: CI - customer-process-api

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate, test, and package PAPI
    runs-on: ubuntu-latest

    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Display Java and Maven versions
        shell: bash
        run: |
          java -version
          mvn -B --version

      - name: Check required Anypoint secrets
        shell: bash
        run: |
          if [ -z "$ANYPOINT_CLIENT_ID" ]; then
            echo "::error::ANYPOINT_CLIENT_ID repository secret is missing"
            exit 1
          fi

          if [ -z "$ANYPOINT_CLIENT_SECRET" ]; then
            echo "::error::ANYPOINT_CLIENT_SECRET repository secret is missing"
            exit 1
          fi

          echo "Required Anypoint repository secrets are available."

      - name: Create Maven settings.xml
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"

          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          settings_namespace = "http://maven.apache.org/SETTINGS/1.0.0"
          xsi_namespace = "http://www.w3.org/2001/XMLSchema-instance"

          ET.register_namespace("", settings_namespace)
          ET.register_namespace("xsi", xsi_namespace)

          client_id = os.environ["ANYPOINT_CLIENT_ID"]
          client_secret = os.environ["ANYPOINT_CLIENT_SECRET"]

          root = ET.Element(
              f"{{{settings_namespace}}}settings",
              {
                  f"{{{xsi_namespace}}}schemaLocation":
                      "http://maven.apache.org/SETTINGS/1.0.0 "
                      "https://maven.apache.org/xsd/settings-1.0.0.xsd"
              }
          )

          servers = ET.SubElement(
              root,
              f"{{{settings_namespace}}}servers"
          )

          server = ET.SubElement(
              servers,
              f"{{{settings_namespace}}}server"
          )

          server_id = ET.SubElement(
              server,
              f"{{{settings_namespace}}}id"
          )
          server_id.text = "anypoint-exchange-v3"

          username = ET.SubElement(
              server,
              f"{{{settings_namespace}}}username"
          )
          username.text = "~~~Client~~~"

          password = ET.SubElement(
              server,
              f"{{{settings_namespace}}}password"
          )
          password.text = client_id + "~?~" + client_secret

          settings_path = os.path.expanduser("~/.m2/settings.xml")

          tree = ET.ElementTree(root)
          tree.write(
              settings_path,
              encoding="UTF-8",
              xml_declaration=True
          )

          ET.parse(settings_path)

          print(
              "Maven settings.xml created successfully "
              "for server anypoint-exchange-v3"
          )
          PY

      - name: Validate Maven settings.xml safely
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          settings_path = os.path.expanduser("~/.m2/settings.xml")
          tree = ET.parse(settings_path)
          root = tree.getroot()

          namespace = {
              "m": "http://maven.apache.org/SETTINGS/1.0.0"
          }

          server_id = root.findtext(
              "m:servers/m:server/m:id",
              namespaces=namespace
          )

          username = root.findtext(
              "m:servers/m:server/m:username",
              namespaces=namespace
          )

          password = root.findtext(
              "m:servers/m:server/m:password",
              namespaces=namespace
          )

          if server_id != "anypoint-exchange-v3":
              raise RuntimeError(
                  "Maven server ID is missing or incorrect"
              )

          if username != "~~~Client~~~":
              raise RuntimeError(
                  "Connected App Maven username is incorrect"
              )

          if not password or "~?~" not in password:
              raise RuntimeError(
                  "Connected App Maven password format is incorrect"
              )

          print("Maven settings.xml is valid.")
          print("Maven server ID: anypoint-exchange-v3")
          print("Connected App authentication format is configured.")
          PY

      - name: Maven validate
        shell: bash
        run: |
          mvn \
            -B \
            -ntp \
            -s "$HOME/.m2/settings.xml" \
            validate

      - name: Run MUnit tests and coverage
        shell: bash
        run: |
          mvn \
            -B \
            -ntp \
            -s "$HOME/.m2/settings.xml" \
            clean test

      - name: Discover generated MUnit reports
        if: always()
        shell: bash
        run: |
          echo "============================================"
          echo "Generated MUnit and test report files"
          echo "============================================"

          if [ -d "target" ]; then
            find target \
              -maxdepth 6 \
              -type f \
              \( \
                -name "*.xml" \
                -o -name "*.html" \
                -o -name "*.txt" \
              \) \
              -print 2>/dev/null || true
          else
            echo "target directory was not generated."
          fi

          if [ -d "reports" ]; then
            find reports \
              -maxdepth 6 \
              -type f \
              \( \
                -name "*.xml" \
                -o -name "*.html" \
                -o -name "*.txt" \
              \) \
              -print 2>/dev/null || true
          else
            echo "reports directory was not generated."
          fi

          echo "============================================"

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-process-api-munit-reports
          path: |
            target/surefire-reports/**
            target/munit-reports/**
            target/site/munit/**
            target/coverage-reports/**
            target/test-results/**
            reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Package Mule application
        shell: bash
        run: |
          mvn \
            -B \
            -ntp \
            -s "$HOME/.m2/settings.xml" \
            package \
            -DskipMunitTests=true

      - name: Locate deployable Mule application JAR
        id: locate_jar
        shell: bash
        run: |
          mapfile -t ARTIFACTS < <(
            find target \
              -maxdepth 1 \
              -type f \
              -name "*-mule-application.jar" \
              ! -name "original-*" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar"
          )

          ARTIFACT_COUNT="${#ARTIFACTS[@]}"

          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No deployable Mule application JAR was found."

            echo "JAR files currently present in target:"
            find target \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -print 2>/dev/null || true

            exit 1
          fi

          if [ "$ARTIFACT_COUNT" -gt 1 ]; then
            echo "::error::Multiple Mule application JARs were found."

            printf '%s\n' "${ARTIFACTS[@]}"

            exit 1
          fi

          ARTIFACT_PATH="${ARTIFACTS[0]}"

          if [ ! -s "$ARTIFACT_PATH" ]; then
            echo "::error::Deployable Mule JAR is empty: $ARTIFACT_PATH"
            exit 1
          fi

          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

          echo "Deployable Mule application JAR:"
          ls -lh "$ARTIFACT_PATH"

      - name: Upload packaged Mule application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: customer-process-api-package
          path: ${{ steps.locate_jar.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Customer Process API CI"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Java: \`17\`"
            echo "- Maven server: \`anypoint-exchange-v3\`"
            echo "- Deployment: \`Not configured\`"
          } >> "$GITHUB_STEP_SUMMARY"